# REST and gRPC share one port. gRPC is served by the same HTTP server rather
# than its own, so callers on either transport reach the service at :9000 and no
# chart, Service or NetworkPolicy has to change while they migrate.
quarkus.grpc.server.use-separate-server=false
quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

# The OpenAPI document is written at build time and published to
# groundsgg/api-reference on release. Rendering stays central: this service does
# not serve a Swagger UI of its own.
quarkus.smallrye-openapi.info-title=Player API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
# Security is declared once on OpenApiConfiguration; auto-adding would attach a
# second, wrong scheme derived from the JWT extension.
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.enabled=false
quarkus.swagger-ui.always-include=false

quarkus.generate-code.grpc.scan-for-proto=gg.grounds:library-grpc-contracts-player

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=player}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
# Agroal pool gauges on /q/metrics: agroal_active_count, agroal_available_count,
# agroal_awaiting_count. This is the signal that a pool is running out — without
# it, exhaustion only shows up as services crash-looping at startup.
# BUILD_AND_RUN_TIME_FIXED: it cannot be switched on with an env var later.
quarkus.datasource.jdbc.metrics.enabled=true

quarkus.flyway.schemas=player
quarkus.flyway.migrate-at-start=true

grounds.player.sessions.ttl=${PLAYER_SESSIONS_TTL:90s}
grounds.player.sessions.cleanup-interval=${PLAYER_SESSIONS_CLEANUP_INTERVAL:30s}

# How often the network-wide player count is pushed to the proxies. The
# server-list ping is answered from that value, so this is how stale the number
# a player sees can be.
grounds.player.counts.broadcast-interval=${PLAYER_COUNTS_BROADCAST_INTERVAL:5s}

nats.url=${NATS_URL:nats://localhost:4222}
nats.max-reconnects=${NATS_MAX_RECONNECTS:-1}
nats.reconnect-wait-seconds=${NATS_RECONNECT_WAIT_SECONDS:2}
grounds.token-file=${GROUNDS_TOKEN_FILE:/var/run/secrets/grounds/token}

# JWT validation for incoming gRPC calls (v2.2 Service Architecture).
grounds.auth.enabled=${GROUNDS_AUTH_ENABLED:true}
grounds.auth.jwks-url=${GROUNDS_AUTH_JWKS_URL:https://kubernetes.default.svc/openid/v1/jwks}
grounds.auth.expected-audience=${GROUNDS_AUTH_AUDIENCE:grounds-services}
# In-cluster JWKS fetch trusts the cluster CA + sends this pod's SA-Token as a bearer.
grounds.auth.k8s-ca-file=${GROUNDS_AUTH_K8S_CA_FILE:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
grounds.auth.k8s-token-file=${GROUNDS_AUTH_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}

# Server-side OpenTelemetry — one span per incoming gRPC call, exported to
# Alloy → Tempo. Disabled by default (local/test); enabled in-cluster via
# OTEL_SDK_DISABLED=false. Matches service-config/social/leaderboard.
quarkus.application.name=service-player
# Stamped into the published OpenAPI document, so a reader can tell which build
# a snapshot describes.
quarkus.application.version=${QUARKUS_APPLICATION_VERSION:dev}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}
