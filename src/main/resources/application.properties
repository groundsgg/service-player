quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

# The OpenAPI document is written at build time and published to
# groundsgg/api-reference on release. Rendering stays central: this service does
# not serve a Swagger UI of its own.
quarkus.smallrye-openapi.info-title=Player API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
# Security is declared once on OpenApiConfiguration; auto-adding would attach a
# second, wrong scheme derived from the JWT extension.
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.enabled=false
quarkus.swagger-ui.always-include=false

quarkus.datasource.db-kind=postgresql
# Names this service's connections in pg_stat_activity and PgBouncer SHOW CLIENTS.
quarkus.datasource.jdbc.additional-jdbc-properties.ApplicationName=service-player
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=player}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
# Agroal pool gauges on /q/metrics: agroal_active_count, agroal_available_count,
# agroal_awaiting_count. This is the signal that a pool is running out — without
# it, exhaustion only shows up as services crash-looping at startup.
# BUILD_AND_RUN_TIME_FIXED: it cannot be switched on with an env var later.
quarkus.datasource.jdbc.metrics.enabled=true

quarkus.flyway.schemas=player
quarkus.flyway.migrate-at-start=true

# In prod, POSTGRES_URL may point at PgBouncer in transaction mode, which
# Flyway's session-level SETs and locks do not survive. Flyway runs on its own
# datasource straight to the primary instead (POSTGRES_DIRECT_URL, app-db-rw),
# and falls back to POSTGRES_URL where no direct URL is set.
%prod.quarkus.datasource.migrations.db-kind=postgresql
%prod.quarkus.datasource.migrations.jdbc.url=${POSTGRES_DIRECT_URL:${POSTGRES_URL}}
%prod.quarkus.datasource.migrations.username=${POSTGRES_USER}
%prod.quarkus.datasource.migrations.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.migrations.jdbc.min-size=0
%prod.quarkus.datasource.migrations.jdbc.max-size=2
%prod.quarkus.datasource.migrations.jdbc.additional-jdbc-properties.ApplicationName=service-player-migrations
%prod.quarkus.datasource.migrations.health-exclude=true
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.migrations.schemas=player
%prod.quarkus.flyway.migrations.migrate-at-start=true

grounds.player.sessions.ttl=${PLAYER_SESSIONS_TTL:90s}
grounds.player.sessions.cleanup-interval=${PLAYER_SESSIONS_CLEANUP_INTERVAL:30s}

# How often the network-wide player count is pushed to the proxies. The
# server-list ping is answered from that value, so this is how stale the number
# a player sees can be.
grounds.player.counts.broadcast-interval=${PLAYER_COUNTS_BROADCAST_INTERVAL:5s}

# With this on, the broadcast also carries the players per backend server:
# {"total":N,"servers":{"<server>":n,..}}. One GROUPING SETS query per tick
# replaces the per-proxy aggregate; `total` stays the first key, so older proxy
# plugins keep reading it.
grounds.player.counts.broadcast-servers=${PLAYER_COUNTS_BROADCAST_SERVERS:false}

# Which half of the service this process is: `all`, the regional runtime, or
# `writer`, the same image in core that only applies the writes regions queue on
# the PLAYER_EVENTS stream (no count broadcast, no stale cleanup, no settings
# cache). See PlayerRole.
grounds.player.role=${PLAYER_ROLE:all}

# Queued writes. On, the name sighting at login, the server change (PUT
# /v2/players/{id}/session/server) and, with async-logout too, the logout
# (DELETE /v2/players/{id}/session) are published to the region's in-memory
# JetStream buffer (PLAYER_OUTBOX, sourced into the hub's PLAYER_EVENTS) and
# answered once it acknowledged them; the core writer applies them. Anything
# not acknowledged within the timeout is applied synchronously instead. The
# claim itself always stays synchronous: it is the "already online" verdict.
grounds.player.async-writes=${PLAYER_ASYNC_WRITES:false}
grounds.player.async-logout=${PLAYER_ASYNC_LOGOUT:false}
grounds.player.events.publish-timeout=${PLAYER_EVENTS_PUBLISH_TIMEOUT:500ms}

# The writer's consumer of PLAYER_EVENTS (core only). The stream and this
# service's hub user are provisioned by grounds-pulumi; the user and password
# travel in NATS_URL.
grounds.player.events.consumer.enabled=${PLAYER_EVENTS_CONSUMER_ENABLED:false}
grounds.player.events.consumer.stream=${PLAYER_EVENTS_CONSUMER_STREAM:PLAYER_EVENTS}
grounds.player.events.consumer.durable=${PLAYER_EVENTS_CONSUMER_DURABLE:player-writer}
grounds.player.events.consumer.poll-interval=${PLAYER_EVENTS_CONSUMER_POLL_INTERVAL:1s}
grounds.player.events.consumer.batch-size=${PLAYER_EVENTS_CONSUMER_BATCH_SIZE:100}
grounds.player.events.consumer.retry-delay=${PLAYER_EVENTS_CONSUMER_RETRY_DELAY:5s}

# Locale and preferred region served from a cache: in-process (L1) and, with a
# URL, the region's valkey-cache (L2, never the matchmaking Valkey). Writes go
# to the database, drop both levels and publish player.settings.changed.<id>,
# on which every runtime drops its copies. Turn it on in every runtime of a
# deployment together: a runtime with it off does not publish invalidations.
grounds.player.settings-cache.enabled=${PLAYER_SETTINGS_CACHE_ENABLED:false}
grounds.player.settings-cache.valkey-url=${PLAYER_SETTINGS_CACHE_VALKEY_URL:}
grounds.player.settings-cache.ttl=${PLAYER_SETTINGS_CACHE_TTL:30m}
grounds.player.settings-cache.max-entries=${PLAYER_SETTINGS_CACHE_MAX_ENTRIES:50000}
grounds.player.settings-cache.valkey-timeout=${PLAYER_SETTINGS_CACHE_VALKEY_TIMEOUT:100ms}
quarkus.redis.hosts=${PLAYER_SETTINGS_CACHE_VALKEY_URL:redis://localhost:6379}
# The L2 is optional, so Valkey must never fail readiness, and tests bring their own.
quarkus.redis.health.enabled=false
quarkus.redis.devservices.enabled=false

nats.url=${NATS_URL:nats://localhost:4222}
nats.max-reconnects=${NATS_MAX_RECONNECTS:-1}
nats.reconnect-wait-seconds=${NATS_RECONNECT_WAIT_SECONDS:2}
grounds.token-file=${GROUNDS_TOKEN_FILE:/var/run/secrets/grounds/token}

# JWT validation for incoming calls (v2.2 Service Architecture).
grounds.auth.enabled=${GROUNDS_AUTH_ENABLED:true}
grounds.auth.jwks-url=${GROUNDS_AUTH_JWKS_URL:https://kubernetes.default.svc/openid/v1/jwks}
grounds.auth.expected-audience=${GROUNDS_AUTH_AUDIENCE:grounds-services}
# In-cluster JWKS fetch trusts the cluster CA + sends this pod's SA-Token as a bearer.
grounds.auth.k8s-ca-file=${GROUNDS_AUTH_K8S_CA_FILE:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
grounds.auth.k8s-token-file=${GROUNDS_AUTH_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}

# Server-side OpenTelemetry — one span per incoming HTTP request, exported to
# Alloy → Tempo. Disabled by default (local/test); enabled in-cluster via
# OTEL_SDK_DISABLED=false. Matches service-config/social/leaderboard.
quarkus.application.name=service-player
# Stamped into the published OpenAPI document, so a reader can tell which build
# a snapshot describes.
quarkus.application.version=${QUARKUS_APPLICATION_VERSION:dev}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}
