quarkus.grpc.clients.player-presence.host=localhost
quarkus.grpc.clients.player-presence.port=9001
quarkus.grpc.clients.player-presence.plain-text=true

quarkus.flyway.migrate-at-start=false
quarkus.scheduler.enabled=false

# The @QuarkusTest gRPC clients don't attach a bearer; disable auth so the
# global interceptor passes calls through (the JWT path is unit-tested in
# AuthContextTest + exercised live in-cluster).
grounds.auth.enabled=false
